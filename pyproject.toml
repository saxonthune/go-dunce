[project]
name = "go-dunce"
version = "0.1.0"
description = "Pull Go games from OGS, find mistakes with KataGo, and have an LLM explain them."
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sgfmill>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
go-dunce = "go_dunce.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/go_dunce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
